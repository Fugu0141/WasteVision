<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071a24" />
    <title>WasteVision — On-device scanner demo</title>
    <link rel="stylesheet" href="./demo/style.css" />
  </head>
  <body>
    <main class="layout">
      <header class="heading">
        <p class="eyebrow">WASTEVISION / EXPERIMENTAL v0.1</p>
        <h1>See waste differently.</h1>
        <p>カメラ映像を端末内で解析し、検出した物体にラベルを重ねます。</p>
      </header>
      <section class="panel" aria-label="スキャナー">
        <div class="viewport">
          <video id="camera" autoplay muted playsinline aria-label="カメラ映像"></video>
          <canvas id="overlay" aria-hidden="true"></canvas>
          <div class="target" aria-hidden="true"></div>
          <span class="camera-badge">ON-DEVICE VISION</span>
        </div>
        <div class="controls">
          <button id="start" type="button">カメラを開始</button>
          <button id="stop" type="button" disabled>停止</button>
          <p id="status" role="status" aria-live="polite">準備完了。開始を押してください。</p>
        </div>
      </section>
      <section class="information">
        <div class="info-card">
          <h2>Detected objects</h2>
          <ul id="results"><li>検出待ち</li></ul>
          <p class="note">物体認識の信頼度は、材質の信頼度ではありません。</p>
        </div>
        <div class="info-card">
          <div class="card-title"><h2>SDK output</h2><button id="copy" type="button">JSONをコピー</button></div>
          <pre id="json" aria-live="off">{ "detections": [] }</pre>
        </div>
      </section>
      <footer>
        <p>2D AR風オーバーレイ / 材質判定は未実装 / 画像はSDKから送信しません。</p>
        <a href="./camera-test.html">カメラだけを診断する</a>
        <a href="https://github.com/Fugu0141/WasteVision">GitHub Repository</a>
      </footer>
    </main>
    <script>
      // No bundler dependency: detect when the SDK module fails to load on GitHub Pages.
      // This fallback deliberately works even when Pages publishes raw source files.
      (() => {
        const start = document.getElementById("start");
        const stop = document.getElementById("stop");
        const video = document.getElementById("camera");
        const status = document.getElementById("status");
        let diagnosticStream = null;
        start.addEventListener("click", async () => {
          if (start.dataset.sdkReady === "true") return;
          start.disabled = true;
          status.textContent = "診断モード：カメラのアクセスを確認中…";
          try {
            if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
              throw new Error("HTTPSまたはlocalhostで開いてください。カメラAPIが使えません。");
            }
            diagnosticStream = await navigator.mediaDevices.getUserMedia({
              audio: false, video: { facingMode: { ideal: "environment" } }
            });
            video.srcObject = diagnosticStream;
            video.muted = true;
            video.playsInline = true;
            await video.play();
            status.textContent = "カメラ接続成功。ただしAIのJavaScriptが読み込めていません。GitHub Settings → Pages → Sourceを「GitHub Actions」に変更してください。";
            stop.disabled = false;
          } catch (error) {
            status.textContent = "診断エラー：" + (error?.message || error?.name || String(error));
            start.disabled = false;
          }
        });
        stop.addEventListener("click", () => {
          if (!diagnosticStream) return;
          diagnosticStream.getTracks().forEach((track) => track.stop());
          diagnosticStream = null;
          video.srcObject = null;
          stop.disabled = true;
          start.disabled = false;
          status.textContent = "診断を停止しました。";
        });
        window.addEventListener("pagehide", () => {
          diagnosticStream?.getTracks().forEach((track) => track.stop());
        });
      })();
    </script>
    <script type="module" src="./demo/main.js"></script>
  </body>
</html>
